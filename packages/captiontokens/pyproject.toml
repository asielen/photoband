# captiontokens as a stand-alone distribution, for photokin and other users:
#   pip install ./packages/captiontokens
# Photoband does NOT install it this way: the photoband distribution includes this package
# directly (see the repository's setup.py), so `pip install -e .` at the root is all Photoband
# needs. Don't install both into the same environment; they provide the same `captiontokens`
# import and the second install would overwrite the first's files.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "captiontokens"
version = "1.0.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Caption token templates shared by Photoband and photokin"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["captiontokens"]
