[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "photoband"
dynamic = ["version"]  # single source: photoband/__init__.py __version__
description = "Polaroid-style caption bands for photos, with an exact live preview"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
# captiontokens is NOT a dependency: it ships inside this distribution as a second top-level
# package (see setup.py), so it never resolves to a same-named package from PyPI.
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9",
  "numpy>=1.26", "Pillow>=10.2", "tifffile>=2024.2", "imagecodecs>=2024.1",
  # 5.x changed APIs the hidden-marker code relies on (6 marker tests fail)
  "opencv-python-headless>=4.9,<5",
  "reedsolo>=1.7", "fonttools>=4.47", "psutil>=5.9",
  # the desktop window; `photoband serve` never imports it
  "pywebview>=5.0",
  # native OCR engines, installed only on their own platform
  "pyobjc-framework-Vision; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz; sys_platform == 'darwin'",
  "winrt-Windows.Media.Ocr; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams; sys_platform == 'win32'",
  "winrt-Windows.Globalization; sys_platform == 'win32'",
  "winrt-Windows.Foundation; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.5", "httpx>=0.27", "playwright>=1.44", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]
# kept for older instructions; the OCR packages are now regular platform-marked dependencies
mac = ["pyobjc-framework-Vision; sys_platform == 'darwin'"]
win = ["winrt-Windows.Media.Ocr; sys_platform == 'win32'"]

[project.scripts]
photoband = "photoband.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "photoband.__version__" }

# packages / package-dir / package data live in setup.py (they need a build step that copies
# ui/dist and fonts/ into the wheel).

[tool.pytest.ini_options]
testpaths = ["tests", "packages/captiontokens/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["ui", "fonts", "vendor", "build", "dist", "packaging/*.spec"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = [
  "E501",            # long lines: the code base wraps at ~110-120 by hand
  "E701", "E702", "E731", "E741",
  "B008",            # FastAPI's Body(...) defaults
  "B904",            # raise ... from e: not applied consistently yet
  "B023", "B007", "B905",
  "UP006", "UP007", "UP035", "UP045", # typing.Dict/Optional style kept (py3.9-compatible look)
  "UP012", "UP015", "UP031", "UP037",  # cosmetic modernizations, not worth the churn
  "I001",            # import order: not enforced until a one-time `ruff check --select I --fix`
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "B017", "F401", "F841"]
"packages/captiontokens/tests/**" = ["F401"]
"scripts/make_fixtures.py" = ["F401"]
